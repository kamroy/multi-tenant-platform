apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-slo-dashboard
  namespace: platform
  labels:
    grafana_dashboard: "1"   # détecté automatiquement par le sidecar Grafana
data:
  tenant-slo.json: |
    {
      "title": "Fiabilité par tenant (SLO)",
      "uid": "tenant-slo",
      "timezone": "browser",
      "schemaVersion": 39,
      "panels": [
        {
          "type": "stat",
          "title": "Disponibilité (SLI) - team-a",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 0 },
          "targets": [
            { "expr": "tenant:sli_availability:ratio_rate5m{namespace=\"team-a\"} * 100" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 99 },
                  { "color": "green", "value": 99.5 }
                ]
              }
            }
          }
        },
        {
          "type": "gauge",
          "title": "Error budget restant - team-a",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 0 },
          "targets": [
            { "expr": "tenant:error_budget_remaining:ratio30d{namespace=\"team-a\"} * 100" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 10 },
                  { "color": "green", "value": 50 }
                ]
              }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Burn rate (1h) - team-a",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 0 },
          "targets": [
            { "expr": "tenant:slo_availability_burn_rate:ratio_rate1h{namespace=\"team-a\"}" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Latence p95 - team-a",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [
            { "expr": "tenant:sli_latency_p95:5m{namespace=\"team-a\"}" }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "type": "timeseries",
          "title": "Disponibilité dans le temps - team-a",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [
            { "expr": "tenant:sli_availability:ratio_rate5m{namespace=\"team-a\"} * 100" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent" } }
        }
      ]
    }
