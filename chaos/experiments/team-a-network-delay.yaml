apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: team-a-network-delay
  namespace: team-a
spec:
  schedule: "@every 15m"
  concurrencyPolicy: Forbid
  historyLimit: 5
  type: NetworkChaos
  networkChaos:
    action: delay
    mode: all
    selector:
      namespaces:
        - team-a
      labelSelectors:
        chaos-target: "true"
    delay:
      latency: "200ms"
      jitter: "50ms"
      correlation: "25"
    duration: "2m"
