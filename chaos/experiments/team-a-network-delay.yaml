# Injecte 200ms de latence sur le trafic sortant de team-a pendant 2 minutes,
# toutes les 15 minutes. Objectif : vérifier que les SLO de latence des
# dépendances sont respectés même sous dégradation réseau.

apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: team-a-network-delay
  namespace: team-a
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - team-a
    labelSelectors:
      chaos-target: "true"
  delay:
    latency: "200ms"
    jitter: "50ms"
    correlation: "25"
  duration: "2m"
  scheduler:
    cron: "@every 15m"
