apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: team-a-pod-kill
  namespace: team-a
spec:
  schedule: "@every 5m"
  concurrencyPolicy: Forbid
  historyLimit: 5
  type: PodChaos
  podChaos:
    action: pod-kill
    mode: fixed-percent
    value: "50"
    selector:
      namespaces:
        - team-a
      labelSelectors:
        chaos-target: "true"
