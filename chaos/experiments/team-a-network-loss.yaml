apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: team-a-network-loss
  namespace: team-a
spec:
  schedule: "@every 20m"
  concurrencyPolicy: Forbid
  historyLimit: 5
  type: NetworkChaos
  networkChaos:
    action: loss
    mode: all
    selector:
      namespaces:
        - team-a
      labelSelectors:
        chaos-target: "true"
    loss:
      loss: "20"
      correlation: "25"
    duration: "2m"
