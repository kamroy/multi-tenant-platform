apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: team-b-developer
  namespace: team-b
rules:
  - apiGroups: ["", "apps", "batch"]
    resources: ["pods", "deployments", "services", "configmaps", "secrets", "jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/exec"]
    verbs: ["get", "list", "create"]
  # Volontairement PAS de droits sur ResourceQuota, NetworkPolicy, RBAC :
  # ces objets sont gérés par la plateforme (GitOps), pas par les équipes.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-b-developer-binding
  namespace: team-b
subjects:
  - kind: Group
    name: team-b-developers   # à mapper avec ton IdP (OIDC group claim)
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: team-b-developer
  apiGroup: rbac.authorization.k8s.io
