# Workload de démo (nginx) pour team-a, avec le label chaos-target: "true"
# qui l'expose explicitement aux expériences de chaos (opt-in, pas
# de ciblage implicite de tout le namespace).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: team-a
  labels:
    app: demo-api
    chaos-target: "true"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
        chaos-target: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: team-a
spec:
  selector:
    app: demo-api
  ports:
    - port: 80
      targetPort: 8080
---
# Le PodDisruptionBudget garantit qu'au moins 2 replicas sur 3 restent
# disponibles même pendant une expérience de chaos pod-kill combinée à
# une maintenance de nœud légitime.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: demo-api-pdb
  namespace: team-a
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: demo-api
